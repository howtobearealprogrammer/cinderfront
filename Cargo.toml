[package]
name = "cinderfront"
version = "0.1.0"
edition = "2021"

[dependencies]
if-addrs = "0.15.0"
bevy = { version = "0.20.1", default-features = false, features = [
    "default_app",
    "std",
    "3d_bevy_render",
    "ui_api",
    "ui_bevy_render",
    "bevy_winit",
    "x11",
    "wayland",
    "multi_threaded",
    "default_font",
    "scene",
    "keyboard",
    "mouse",
    "custom_cursor",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
